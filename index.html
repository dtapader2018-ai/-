<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>বিদ্রোহী চার্বাক</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans Bengali","Nirmala UI",sans-serif;background:radial-gradient(circle at top,#3b1d5a,#130d20 65%);color:#fff;padding:20px}.card{width:100%;max-width:520px;text-align:center;padding:30px 22px;border:1px solid #ffffff33;border-radius:28px;background:#ffffff17;box-shadow:0 18px 60px #00000059}.emoji{font-size:54px}h1{margin:10px 0 8px;font-size:30px}.subtitle{color:#e7d8f7;font-size:17px;margin-bottom:22px}.date{font-size:20px;font-weight:700;color:#ffd88a;margin:10px 0 24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.unit{background:#00000047;border-radius:16px;padding:15px 4px 10px}.number{display:block;font-size:30px;font-weight:800}.label{font-size:12px;color:#ddd}.message{margin:25px 0 20px;font-size:17px;line-height:1.7}.note{font-size:12px;color:#cfc3da;margin-top:18px;line-height:1.5}</style></head><body><main class="card"><div class="emoji">🎭</div><h1>বিদ্রোহী চার্বাক</h1><div class="subtitle">সবাই মিলে সফল করি আমাদের মঞ্চায়ন</div><div class="date">📅 ২৫ ডিসেম্বর ২০২৬</div><section class="grid"><div class="unit"><span class="number" id="days">0</span><span class="label">দিন</span></div><div class="unit"><span class="number" id="hours">0</span><span class="label">ঘণ্টা</span></div><div class="unit"><span class="number" id="minutes">0</span><span class="label">মিনিট</span></div><div class="unit"><span class="number" id="seconds">0</span><span class="label">সেকেন্ড</span></div></section><div class="message" id="message">🔥 আর বেশি দিন নেই! আমাদের পরিশ্রম, নিষ্ঠা ও দলগত প্রচেষ্টায় সফল হোক এই নাটকের মঞ্চায়ন।</div><div class="note">কাউন্টডাউন নিজে থেকেই আপডেট হবে। এই পেজের লিংক WhatsApp গ্রুপে শেয়ার করুন।</div></main><script>const target=new Date(2026,11,25,0,0,0).getTime();function update(){let d=Math.max(0,target-Date.now()),s=Math.floor(d/1000),days=Math.floor(s/86400),hours=Math.floor(s%86400/3600),minutes=Math.floor(s%3600/60),seconds=s%60;document.getElementById('days').textContent=days;document.getElementById('hours').textContent=String(hours).padStart(2,'0');document.getElementById('minutes').textContent=String(minutes).padStart(2,'0');document.getElementById('seconds').textContent=String(seconds).padStart(2,'0');}update();setInterval(update,1000);</script></body></html>
